services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1"
          memory: 1G

  app:
    image: ${APP_IMAGE:-dzwk-erp:latest}
    environment:
      NODE_ENV: production
    secrets:
      - env_prod
    networks:
      - internal
      - public
    ports:
      - target: 3000
        published: 3000
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  internal:
    driver: overlay
  public:
    driver: overlay
    attachable: true

volumes:
  pgdata:

secrets:
  env_prod:
    file: ./.env.prod
    name: ${ENV_SECRET_NAME}
